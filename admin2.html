<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OP MART — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f4f6f8;
    color: #111;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 22px;
    margin-bottom: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

h1, h2 {
    margin-top: 0;
}

input, select, button {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border-radius: 9px;
    border: 1px solid #ddd;
    font-size: 15px;
}

button {
    border: none;
    background: #111;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .85;
}

.logout {
    background: #555;
}

.add-btn {
    background: #087f5b;
}

.delete-btn {
    background: #d62828;
}

.edit-btn {
    background: #2563eb;
}

.cancel-btn {
    background: #777;
}

.hidden {
    display: none;
}

.message {
    margin-top: 10px;
    font-weight: bold;
}

.product {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
}

.product img {
    width: 100%;
    max-width: 180px;
    height: 140px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 10px;
}

.price {
    font-size: 20px;
    font-weight: bold;
}

.old-price {
    text-decoration: line-through;
    color: #888;
    margin-left: 8px;
}

.actions {
    display: flex;
    gap: 8px;
}

.actions button {
    flex: 1;
}

#adminPanel {
    display: none;
}

#adminPanel.active {
    display: block;
}

@media (max-width: 600px) {
    .container {
        padding: 12px;
    }

    .box {
        padding: 16px;
    }

    .actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="box">

    <h1>OP MART</h1>
    <h2>Admin Login</h2>

    <input
        id="email"
        type="email"
        placeholder="Admin Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPanel">

    <div class="box">

        <h1>OP MART Admin Panel 🛒</h1>

        <button
            class="logout"
            onclick="logout()">
            Logout
        </button>

    </div>


    <!-- ADD / EDIT PRODUCT -->
    <div class="box">

        <h2 id="formTitle">➕ Add Product</h2>

        <input
            id="productName"
            type="text"
            placeholder="Product Name"
        >

        <input
            id="productPrice"
            type="number"
            placeholder="Selling Price"
        >

        <input
            id="productOldPrice"
            type="number"
            placeholder="Old Price"
        >

        <input
            id="productCategory"
            type="text"
            placeholder="Category"
        >

        <input
            id="productStock"
            type="number"
            placeholder="Stock"
        >

        <input
            id="productImage"
            type="url"
            placeholder="Product Image URL"
        >

        <button
            id="saveBtn"
            class="add-btn"
            onclick="saveProduct()">
            Add Product
        </button>

        <button
            id="cancelBtn"
            class="cancel-btn hidden"
            onclick="cancelEdit()">
            Cancel Edit
        </button>

        <div id="productMessage" class="message"></div>

    </div>


    <!-- PRODUCTS -->
    <div class="box">

        <h2>📦 Products</h2>

        <button onclick="loadProducts()">
            🔄 Refresh Products
        </button>

        <div id="productsList"></div>

    </div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oqlovhxuitkuqnmvttza.supabase.co";

const SUPABASE_KEY =
"sb_publishable_T5EUaq_ivr5-Wiknxa7Cgg_EGjX2YKM";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let editingId = null;


/* =========================
   LOGIN
========================= */

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    message.textContent = "Logging in...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        message.textContent =
            "Login failed: " + error.message;

        return;
    }

    message.textContent = "";

    showAdmin();

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin() {

    document.getElementById("loginBox")
        .classList.add("hidden");

    document.getElementById("adminPanel")
        .classList.add("active");

    loadProducts();
}


/* =========================
   LOGOUT
========================= */

async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();
}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct() {

    const name =
        document.getElementById("productName")
        .value.trim();

    const price =
        document.getElementById("productPrice")
        .value;

    const oldPrice =
        document.getElementById("productOldPrice")
        .value;

    const category =
        document.getElementById("productCategory")
        .value.trim();

    const stock =
        document.getElementById("productStock")
        .value;

    const image =
        document.getElementById("productImage")
        .value.trim();

    const message =
        document.getElementById("productMessage");


    if (!name || !price || !category || stock === "") {

        message.textContent =
            "Please fill Name, Price, Category and Stock.";

        return;
    }


    message.textContent = "Saving...";


    const productData = {

        name: name,

        price: Number(price),

        old_price:
            oldPrice ? Number(oldPrice) : null,

        category: category,

        stock: Number(stock),

        image: image || null
    };


    let error;


    /* EDIT */

    if (editingId !== null) {

        const result =
            await supabaseClient
                .from("products")
                .update(productData)
                .eq("id", editingId);

        error = result.error;

    }


    /* ADD */

    else {

        const result =
            await supabaseClient
                .from("products")
                .insert([productData]);

        error = result.error;
    }


    if (error) {

        message.textContent =
            "Error: " + error.message;

        return;
    }


    message.textContent =
        editingId !== null
        ? "Product updated successfully! ✅"
        : "Product added successfully! ✅";


    clearForm();

    loadProducts();

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

    const list =
        document.getElementById("productsList");

    list.innerHTML =
        "Loading products...";


    const { data, error } =
        await supabaseClient
            .from("products")
            .select("*")
            .order("id", { ascending: false });


    if (error) {

        list.innerHTML =
            "Error: " + error.message;

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML =
            "<p>No products added yet.</p>";

        return;
    }


    list.innerHTML = "";


    data.forEach(product => {

        const div =
            document.createElement("div");

        div.className = "product";


        const imageHTML =
            product.image
            ? `<img src="${escapeHTML(product.image)}"
                 alt="${escapeHTML(product.name)}">`
            : "";


        const oldPriceHTML =
            product.old_price
            ? `<span class="old-price">
                 Rs ${product.old_price}
               </span>`
            : "";


        div.innerHTML = `

            ${imageHTML}

            <h3>
                ${escapeHTML(product.name)}
            </h3>

            <div>
                <span class="price">
                    Rs ${product.price}
                </span>

                ${oldPriceHTML}
            </div>

            <p>
                Category:
                ${escapeHTML(product.category || "General")}
            </p>

            <p>
                Stock:
                ${product.stock}
            </p>

            <div class="actions">

                <button
                    class="edit-btn"
                    onclick="editProduct(${product.id})">
                    ✏️ Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteProduct(${product.id})">
                    🗑️ Delete
                </button>

            </div>
        `;


        list.appendChild(div);

    });

}


/* =========================
   EDIT PRODUCT
========================= */

async function editProduct(id) {

    const { data, error } =
        await supabaseClient
            .from("products")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert("Error: " + error.message);

        return;
    }


    editingId = id;


    document.getElementById("productName")
        .value = data.name || "";

    document.getElementById("productPrice")
        .value = data.price || "";

    document.getElementById("productOldPrice")
        .value = data.old_price || "";

    document.getElementById("productCategory")
        .value = data.category || "";

    document.getElementById("productStock")
        .value = data.stock || "";

    document.getElementById("productImage")
        .value = data.image || "";


    document.getElementById("formTitle")
        .textContent = "✏️ Edit Product";

    document.getElementById("saveBtn")
        .textContent = "Update Product";

    document.getElementById("cancelBtn")
        .classList.remove("hidden");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmed) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "Delete failed: " +
            error.message
        );

        return;
    }


    alert(
        "Product deleted successfully! ✅"
    );


    loadProducts();

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

    clearForm();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm() {

    editingId = null;


    document.getElementById("productName")
        .value = "";

    document.getElementById("productPrice")
        .value = "";

    document.getElementById("productOldPrice")
        .value = "";

    document.getElementById("productCategory")
        .value = "";

    document.getElementById("productStock")
        .value = "";

    document.getElementById("productImage")
        .value = "";


    document.getElementById("formTitle")
        .textContent = "➕ Add Product";

    document.getElementById("saveBtn")
        .textContent = "Add Product";

    document.getElementById("cancelBtn")
        .classList.add("hidden");

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

    const { data } =
        await supabaseClient.auth.getSession();


    if (data.session) {

        showAdmin();

    }

}


checkSession();

</script>

</body>
  </html>
